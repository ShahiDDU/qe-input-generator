[theme]
base                     = "light"
primaryColor             = "#1565C0"
backgroundColor          = "#FFFFFF"
secondaryBackgroundColor = "#F0F4F8"
textColor                = "#1A1A2E"
font                     = "sans serif"

[server]
headless             = true
enableXsrfProtection = false
maxUploadSize        = 200

[browser]
gatherUsageStats = false
